name: Test and deploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python ingest.py --dry-run

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: nexacrm-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Deploy exact commit
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          result="$(ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "nexacrm@$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" < deploy/deploy.sh)"
          printf '%s\n' "$result"
          if [[ "$result" == *"SKIPPED: master moved"* ]]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_sha="$(printf '%s\n' "$result" | sed -n 's/^PREVIOUS_SHA: //p' | tail -n 1)"
          test "$previous_sha" = NONE || [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          remote_sha="$(ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "nexacrm@$DEPLOY_HOST" \
            'git -C /srv/nexacrm/current rev-parse HEAD')"
          test "$remote_sha" = "$GITHUB_SHA"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify HTTPS and admin boundary
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --output /dev/null https://uai-dbezz.ru/; then
              break
            fi
            sleep 3
          done
          curl --fail --silent --show-error --output /dev/null https://uai-dbezz.ru/
          admin_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' https://uai-dbezz.ru/admin/)"
          test "$admin_status" = 401
      - name: Roll back when public verification fails
        if: failure() && steps.deploy.outputs.deployed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          PREVIOUS_SHA: ${{ steps.deploy.outputs.previous_sha }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "nexacrm@$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" "$PREVIOUS_SHA" < deploy/rollback.sh
